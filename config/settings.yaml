ollama:
  base_url: "http://localhost:11434"
  timeout_seconds: 120
  keep_alive: "5m"

models:
  language_model: "gemma4:12b-it-qat"
  decision_model: "d1:latest"
  debater_temperature: 0.7
  compactor_temperature: 0.2

debate:
  language: "Spanish"
  max_rounds: 15
  max_response_words: 180
  max_turn_attempts: 2

context:
  num_ctx: 16384
  compaction_threshold_ratio: 0.75
  compaction_interval_rounds: 3
  retain_recent_rounds: 2

judge:
  min_stance_probability: 0.50
  max_repetition_probability: 0.70
  end_debate_probability: 0.75
